spring.application.name=backend
app.auth.pepper=${APP_AUTH_PEPPER}
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APP_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
app.contract.storage-dir=${CONTRACT_STORAGE_DIR:${user.home}/seedbank/contracts}
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=17MB
