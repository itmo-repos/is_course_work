// ./gradlew
// publishHelios - собрать и загрузить JAR, управляющий скрипт и SQL на Helios
// deployHelios  - выполнить publishHelios и перезапустить backend на Helios
// statusHelios  - показать состояние процесса backend на Helios
// stopHelios    - остановить backend на Helios
// cleanDbHelios - пересоздать таблицы и перезапустить backend
// resetDbHelios - пересоздать таблицы с тестовыми данными и перезапустить backend

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ru.ifmo.is'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

}


tasks.named('processResources') {
    from(rootProject.file('../contract.pdf')) {
        into 'templates'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

def helios = 'helios'
def heliosDir = '/home/studs/s467669/seedbank-backend'
def sshConfig = "${System.getProperty('user.home')}/.ssh/config"
def run = { List command ->
    def process = new ProcessBuilder(command.collect { it.toString() }).redirectErrorStream(true).start()
    process.inputStream.withReader { reader -> reader.eachLine { line -> println(line) } }
    if (process.waitFor() != 0) throw new GradleException("Command failed: ${command[0]}")
}
def ssh = { String command -> run(['ssh', '-F', sshConfig, helios, command]) }

tasks.register('publishHelios') {
    group = 'deployment'
    description = 'Builds and copies the backend JAR and SQL scripts to Helios.'
    dependsOn tasks.named('bootJar')

    doLast {
        def jarFile = tasks.named('bootJar').get().archiveFile.get().asFile
        ssh("mkdir -p '${heliosDir}/sql'")
        run(['rsync', '-a', '-e', "ssh -F ${sshConfig}", jarFile, "${helios}:${heliosDir}/backend.jar"])
        run(['rsync', '-a', '-e', "ssh -F ${sshConfig}", "${rootProject.projectDir}/helios-control.sh",
             "${helios}:${heliosDir}/helios-control.sh"])
        run(['rsync', '-a', '-e', "ssh -F ${sshConfig}", "${rootProject.projectDir.parent}/sql/",
             "${helios}:${heliosDir}/sql/"])
    }
}

tasks.register('deployHelios') {
    group = 'deployment'
    description = 'Publishes and restarts the backend on Helios.'
    dependsOn tasks.named('publishHelios')

    doLast {
        ssh("sh '${heliosDir}/helios-control.sh' restart")
    }
}

['statusHelios': 'status', 'stopHelios': 'stop'].each { taskName, action ->
    tasks.register(taskName) {
        group = 'deployment'
        description = "${action.capitalize()} the backend process on Helios."
        doLast {
            ssh("sh '${heliosDir}/helios-control.sh' ${action}")
        }
    }
}

['cleanDbHelios': 'clean-db', 'resetDbHelios': 'reset-db'].each { taskName, action ->
    tasks.register(taskName) {
        group = 'deployment'
        description = action == 'reset-db'
                ? 'Deletes project data on Helios, recreates tables, loads test data and restarts backend.'
                : 'Deletes project data on Helios, recreates empty tables and restarts backend.'
        doLast {
            ssh("mkdir -p '${heliosDir}/sql'")
            run(['rsync', '-a', '-e', "ssh -F ${sshConfig}", "${rootProject.projectDir.parent}/sql/",
                 "${helios}:${heliosDir}/sql/"])
            run(['rsync', '-a', '-e', "ssh -F ${sshConfig}", "${rootProject.projectDir}/helios-control.sh",
                 "${helios}:${heliosDir}/helios-control.sh"])
            ssh("sh '${heliosDir}/helios-control.sh' ${action}")
        }
    }
}
